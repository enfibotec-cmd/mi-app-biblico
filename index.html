<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="App web segura y offline para consultar versículos bíblicos." />
  <!-- Seguridad: previene ejecución de scripts externos o inyectados -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'" />
  <title>Selector Bíblico</title>
  <link rel="stylesheet" href="src/styles.css" />
  
  <!-- defer asegura que el HTML se lea completo antes de ejecutar JS, manteniendo el orden -->
  <script src="src/js/data.js" defer></script>
  <script src="src/js/utils.js" defer></script>
  <script src="src/js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>📖 Selector Bíblico</h1>
    <button type="button" class="theme-toggle secondary" id="themeToggle" aria-label="Cambiar tema">🌙 Oscuro</button>
  </header>

  <main>
    <!-- Aviso si se abre con doble clic en local (solo aparece si falla la carga) -->
    <div class="ayuda-local" id="ayudaLocal" hidden>
      <strong>Nota:</strong> Para usar la app en tu computadora debes abrir un servidor local 
      (ej. <code>python -m http.server 8000</code>). En GitHub Pages funciona directamente.
    </div>

    <section class="card" aria-labelledby="sel-h">
      <h2 id="sel-h">Seleccionar pasaje</h2>
      
      <div class="controls">
        <select id="book" aria-label="Libro"></select>
        <select id="chapter" aria-label="Capítulo"></select>
        <select id="verse" aria-label="Versículo"></select>
      </div>

      <div class="btn-row">
        <button type="button" id="showBtn">Mostrar versículo</button>
        <button type="button" id="randomBtn" class="secondary">🎲 Aleatorio</button>
        <button type="button" id="copyBtn" class="secondary">📋 Copiar</button>
        <button type="button" id="favBtn" class="secondary">⭐ Guardar</button>
      </div>

      <div class="error" id="error" role="alert" aria-live="polite"></div>
      
      <div class="verse-display" id="verseDisplay" aria-live="polite">
        Cargando...
      </div>
    </section>

    <section class="card" aria-labelledby="fav-h">
      <h2 id="fav-h">⭐ Favoritos guardados</h2>
      <ul class="favorites" id="favList"></ul>
    </section>
  </main>

  <footer>
    <p id="stats">Datos incluidos como muestra representativa.</p>
  </footer>
</body>
</html>
