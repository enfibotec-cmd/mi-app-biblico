<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="App web segura y offline para consultar versículos bíblicos." />
  <title>Selector Bíblico</title>
  <link rel="stylesheet" href="src/CSS/styles.css" />
</head>
<body>
  <header>
    <h1>📖 Selector Bíblico</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌙 Oscuro</button>
  </header>

  <main>
    <section class="card" aria-labelledby="sel-h">
      <h2 id="sel-h">Seleccionar pasaje</h2>
      <div class="controls">
        <select id="book" aria-label="Libro"></select>
        <select id="chapter" aria-label="Capítulo"></select>
        <select id="verse" aria-label="Versículo"></select>
      </div>
      <div class="btn-row">
        <button id="showBtn">Mostrar versículo</button>
        <button id="randomBtn" class="secondary">🎲 Aleatorio</button>
        <button id="favBtn" class="secondary">⭐ Guardar</button>
      </div>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
      <div class="verse-display" id="verseDisplay" aria-live="polite">
        Selecciona un libro, capítulo y versículo para comenzar.
      </div>
    </section>

    <section class="card" aria-labelledby="fav-h">
      <h2 id="fav-h">⭐ Favoritos guardados</h2>
      <ul class="favorites" id="favList"></ul>
    </section>
  </main>

  <footer>
    Datos incluidos como muestra representativa.
  </footer>

  <!-- Scripts en orden: datos → utilidades → app -->
  <script src="../src/js/data.js"></script>
  <script src="../src/js/utils.js"></script>
  <script src="../src/js/app.js"></script>
</body>
</html>
