<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selector Bíblico</title>
  <link rel="stylesheet" href="src/styles.css" />
  <script src="src/js/data.js" defer></script>
  <script src="src/js/app.js" defer></script>
</head>
<body>

  <header class="site-header">
    <h1>📖 Selector Bíblico</h1>
    <button type="button" class="theme-btn" id="themeToggle" aria-label="Cambiar tema">🌙</button>
  </header>

  <main class="main-container">
    <section class="card">
      <h2>Seleccionar Pasaje</h2>
      
      <div class="select-grid">
        <div class="select-group">
          <label for="bookSelect">Libro</label>
          <select id="bookSelect"></select>
        </div>
        <div class="select-group">
          <label for="chapterSelect">Capítulo</label>
          <select id="chapterSelect"></select>
        </div>
        <div class="select-group">
          <label for="verseSelect">Versículo</label>
          <select id="verseSelect"></select>
        </div>
      </div>

      <div class="button-grid">
        <button type="button" id="showBtn" class="btn-primary">Mostrar</button>
        <button type="button" id="randomBtn">🎲 Aleatorio</button>
        <button type="button" id="copyBtn">📋 Copiar</button>
        <button type="button" id="favBtn">⭐ Guardar</button>
      </div>

      <div class="verse-box" id="verseDisplay">
        <!-- El pasaje cargará automáticamente -->
      </div>
    </section>

    <section class="card">
      <h2>⭐ Favoritos Guardados</h2>
      <ul class="fav-list" id="favList"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Selector Bíblico — Funciona 100% offline sin necesidad de servidor.</p>
  </footer>

</body>
</html>
