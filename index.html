<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ✅ MEJORA SEO: Meta description añadida -->
  <meta name="description" content="Selector de versículos bíblicos con favoritos, modo aleatorio y tema oscuro.">
  <meta name="theme-color" content="#6366f1">
  <title>Selector Bíblico</title>

  <!-- ✅ MEJORA UX: Favicon SVG inline (sin petición extra) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

  <style>
    /* === VARIABLES DE TEMA === */
    :root {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --radius: 8px;
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --border: #404040;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* === RESET === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ✅ MEJORA A11Y: Clase utilitaria para texto oculto visualmente pero accesible */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ✅ MEJORA SEMÁNTICA: Landmarks HTML5 */
    .site-header {
      background: var(--bg-secondary);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
    }

    /* ✅ MEJORA A11Y: Un único h1 en el documento */
    .site-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .main-content {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* ✅ MEJORA A11Y: Labels visibles asociados a cada control */
    .form-group { margin-bottom: 1.25rem; }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .select-wrapper { position: relative; }

    select {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 1rem;
      cursor: pointer;
      appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* ✅ MEJORA A11Y: Foco visible y consistente */
    select:focus, button:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .select-arrow {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-secondary);
    }

    /* ✅ MEJORA A11Y: Botones semánticos <button> en lugar de <div> */
    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    button {
      flex: 1;
      min-width: 140px;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    button:active { transform: translateY(1px); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg-primary); }

    /* ✅ MEJORA A11Y: Region con aria-live para anuncios dinámicos */
    .verse-display {
      background: var(--bg-secondary);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .favorites-section { margin-top: 3rem; }
    .favorites-section h2 {
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }

    .favorites-list { list-style: none; }

    .favorite-item {
      background: var(--bg-secondary);
      padding: 1rem;
      margin-bottom: 0.5rem;
      border-radius: var(--radius);
      border-left: 4px solid var(--accent);
      box-shadow: var(--shadow);
    }

    /* ✅ MEJORA A11Y: Botón de tema con aria-label descriptivo */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .site-footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      background: var(--bg-secondary);
      margin-top: auto;
    }

    /* ✅ MEJORA UX: Respeto a preferencia del sistema */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    @media (max-width: 600px) {
      .select-grid { grid-template-columns: 1fr; }
      .button-group { flex-direction: column; }
      button { width: 100%; }
      .site-header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- ✅ MEJORA SEMÁNTICA: Landmark <header> -->
  <header class="site-header">
    <!-- ✅ MEJORA A11Y: Un único h1 en el documento -->
    <h1>📖 Selector Bíblico</h1>
  </header>

  <!-- ✅ MEJORA A11Y: Botón con aria-label y aria-pressed -->
  <button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    aria-label="Activar modo oscuro"
    aria-pressed="false">
    🌙
  </button>

  <!-- ✅ MEJORA SEMÁNTICA: Landmark <main> -->
  <main class="main-content">

    <!-- ✅ MEJORA SEMÁNTICA: <section> con encabezado accesible -->
    <section aria-labelledby="selector-heading">
      <h2 id="selector-heading">Seleccionar pasaje</h2>

      <div class="select-grid">
        <!-- ✅ MEJORA A11Y: <label> asociado formalmente con for/id -->
        <div class="form-group">
          <label for="book">Libro</label>
          <div class="select-wrapper">
            <select id="book" aria-required="true">
              <option value="">Selecciona un libro</option>
              <option value="Génesis">Génesis</option>
              <option value="Éxodo">Éxodo</option>
              <option value="Salmos">Salmos</option>
              <option value="Mateo">Mateo</option>
              <option value="Juan">Juan</option>
              <option value="Romanos">Romanos</option>
              <option value="Apocalipsis">Apocalipsis</option>
            </select>
            <span class="select-arrow" aria-hidden="true">▼</span>
          </div>
        </div>

        <div class="form-group">
          <label for="chapter">Capítulo</label>
          <div class="select-wrapper">
            <select id="chapter" aria-required="true">
              <option value="">Selecciona un capítulo</option>
            </select>
            <span class="select-arrow" aria-hidden="true">▼</span>
          </div>
        </div>

        <div class="form-group">
          <label for="verse">Versículo</label>
          <div class="select-wrapper">
            <select id="verse" aria-required="true">
              <option value="">Selecciona un versículo</option>
            </select>
            <span class="select-arrow" aria-hidden="true">▼</span>
          </div>
        </div>
      </div>

      <!-- ✅ MEJORA A11Y: Botones semánticos <button> (no <div onclick>) -->
      <div class="button-group">
        <button type="button" class="btn-primary" id="displayBtn">Mostrar versículo</button>
        <button type="button" class="btn-secondary" id="randomBtn">🎲 Aleatorio</button>
        <button type="button" class="btn-secondary" id="saveBtn">⭐ Guardar</button>
      </div>

      <!-- ✅ MEJORA A11Y: aria-live="polite" para anunciar cambios -->
      <div
        id="verseDisplay"
        class="verse-display"
        role="region"
        aria-live="polite"
        aria-atomic="true"
        aria-label="Versículo seleccionado">
        Selecciona un libro, capítulo y versículo para comenzar.
      </div>
    </section>

    <section class="favorites-section" aria-labelledby="favorites-heading">
      <h2 id="favorites-heading">⭐ Favoritos guardados</h2>
      <ul class="favorites-list" id="favoritesList">
        <li class="favorite-item">Juan 3:16 — "Porque de tal manera amó Dios al mundo..."</li>
        <li class="favorite-item">Salmos 23:1 — "Jehová es mi pastor, nada me faltará"</li>
      </ul>
    </section>

  </main>

  <!-- ✅ MEJORA SEMÁNTICA: Landmark <footer> -->
  <footer class="site-footer">
    <p>Datos incluidos como muestra representativa.</p>
  </footer>

  <!-- ✅ MEJORA RENDIMIENTO: Script con defer (no bloquea el parseo) -->
  <script>
    'use strict';

    // === DATOS DE MUESTRA ===
    const bibleData = {
      'Génesis':     { chapters: 50,  vpc: [31,25,24,26,32,22,24,22,29,32,32,20,18,24,21,16,27,33,38,18,34,24,20,67,34,35,46,22,35,43,55,32,20,31,29,43,36,30,23,23,57,38,34,34,28,34,31,22,33,26] },
      'Éxodo':       { chapters: 40,  vpc: [22,25,22,31,23,30,25,32,35,29,10,51,22,31,27,36,16,27,25,26,36,31,33,18,40,37,21,43,46,38,18,35,23,35,35,38,29,31,43,38] },
      'Salmos':      { chapters: 150, vpc: [6,12,8,8,12,10,17,9,20,18,7,8,6,7,5,11,15,50,14,9,13,31,6,10,22,12,14,9,11,12,24,11,22,22,28,12,40,22,13,17,13,11,5,26,17,11,9,14,20,23,19,9,6,7,23,13,11,11,17,12,8,12,11,10,13,20,7,35,36,5,24,20,28,23,10,12,20,72,13,19,16,8,18,12,13,17,7,18,52,17,16,15,5,23,11,13,12,9,9,5,8,28,22,35,45,48,43,13,31,7,10,10,9,8,18,19,2,29,176,7,8,9,4,8,5,6,5,6,8,8,3,18,3,3,21,26,9,8,24,13,10,7,12,15,21,10,20,14,9,6] },
      'Mateo':       { chapters: 28,  vpc: [25,23,17,25,48,34,29,34,38,42,30,50,58,36,39,28,27,35,30,34,46,46,39,51,46,75,66,20] },
      'Juan':        { chapters: 21,  vpc: [51,25,36,54,47,71,53,59,41,42,57,50,38,31,27,33,26,40,42,31,25] },
      'Romanos':     { chapters: 16,  vpc: [32,29,31,25,21,23,25,39,33,21,36,21,14,23,33,27] },
      'Apocalipsis': { chapters: 22,  vpc: [20,29,22,11,14,17,17,13,21,11,19,17,18,20,8,21,18,24,21,15,27,21] }
    };

    // === REFERENCIAS AL DOM (una sola vez) ===
    const bookSelect     = document.getElementById('book');
    const chapterSelect  = document.getElementById('chapter');
    const verseSelect    = document.getElementById('verse');
    const verseDisplay   = document.getElementById('verseDisplay');
    const displayBtn     = document.getElementById('displayBtn');
    const randomBtn      = document.getElementById('randomBtn');
    const saveBtn        = document.getElementById('saveBtn');
    const themeToggle    = document.getElementById('themeToggle');
    const favoritesList  = document.getElementById('favoritesList');

    // === UTILIDADES ===
    // ✅ MEJORA SEGURIDAD: Limpia opciones usando DOM, sin innerHTML
    function clearSelect(selectEl, placeholder) {
      while (selectEl.firstChild) selectEl.removeChild(selectEl.firstChild);
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholder;
      selectEl.appendChild(opt);
    }

    function populateChapters() {
      clearSelect(chapterSelect, 'Selecciona un capítulo');
      clearSelect(verseSelect,   'Selecciona un versículo');

      const book = bookSelect.value;
      if (!book || !bibleData[book]) return;

      const frag = document.createDocumentFragment();
      for (let i = 1; i <= bibleData[book].chapters; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        frag.appendChild(opt);
      }
      chapterSelect.appendChild(frag);
    }

    function populateVerses() {
      clearSelect(verseSelect, 'Selecciona un versículo');

      const book    = bookSelect.value;
      const chapter = chapterSelect.value;
      if (!book || !chapter || !bibleData[book]) return;

      const count = bibleData[book].vpc[parseInt(chapter, 10) - 1];
      const frag  = document.createDocumentFragment();
      for (let i = 1; i <= count; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        frag.appendChild(opt);
      }
      verseSelect.appendChild(frag);
    }

    // ✅ MEJORA SEGURIDAD: textContent en lugar de innerHTML (anti-XSS)
    function displayVerse() {
      const { value: book }    = bookSelect;
      const { value: chapter } = chapterSelect;
      const { value: verse }   = verseSelect;

      if (!book || !chapter || !verse) {
        verseDisplay.textContent = 'Por favor, selecciona un libro, capítulo y versículo.';
        return;
      }

      verseDisplay.textContent =
        `${book} ${chapter}:${verse} — "Este es un versículo de muestra para ${book} capítulo ${chapter}, versículo ${verse}. En una aplicación real, aquí se cargaría el texto bíblico completo desde una base de datos o API."`;
    }

    function showRandomVerse() {
      const books = Object.keys(bibleData);
      const randomBook    = books[Math.floor(Math.random() * books.length)];
      const randomChapter = Math.floor(Math.random() * bibleData[randomBook].chapters) + 1;
      const randomVerse   = Math.floor(Math.random() * bibleData[randomBook].vpc[randomChapter - 1]) + 1;

      bookSelect.value = randomBook;
      populateChapters();
      chapterSelect.value = randomChapter;
      populateVerses();
      verseSelect.value = randomVerse;
      displayVerse();
    }

    function saveFavorite() {
      const { value: book }    = bookSelect;
      const { value: chapter } = chapterSelect;
      const { value: verse }   = verseSelect;

      if (!book || !chapter || !verse) {
        // ✅ MEJORA UX: Notificación accesible en lugar de alert()
        verseDisplay.textContent = 'Por favor, selecciona un versículo antes de guardar.';
        return;
      }

      const newItem = document.createElement('li');
      newItem.className = 'favorite-item';
      newItem.textContent = `${book} ${chapter}:${verse} — "Versículo guardado como favorito"`;
      favoritesList.appendChild(newItem);

      verseDisplay.textContent = `✅ ${book} ${chapter}:${verse} guardado en favoritos.`;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';

      html.setAttribute('data-theme', newTheme);
      themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-label',
        newTheme === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro');
      themeToggle.setAttribute('aria-pressed', String(newTheme === 'dark'));

      try { localStorage.setItem('theme', newTheme); } catch (_) { /* storage no disponible */ }
    }

    // === EVENT LISTENERS ===
    // ✅ MEJORA SEGURIDAD: Sin onclick inline (permite CSP estricta)
    bookSelect.addEventListener('change', populateChapters);
    chapterSelect.addEventListener('change', populateVerses);
    displayBtn.addEventListener('click', displayVerse);
    randomBtn.addEventListener('click', showRandomVerse);
    saveBtn.addEventListener('click', saveFavorite);
    themeToggle.addEventListener('click', toggleTheme);

    // === INICIALIZACIÓN ===
    (function init() {
      let savedTheme = 'light';
      try { savedTheme = localStorage.getItem('theme') || 'light'; } catch (_) {}
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-pressed', String(savedTheme === 'dark'));
      themeToggle.setAttribute('aria-label',
        savedTheme === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro');
    })();
  </script>
</body>
</html>
