<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>📖 Selector Bíblico</title>
  <link rel="stylesheet" href="scr/styles.css" />
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
    <span class="theme-icon">🌙</span>
  </button>

  <header class="site-header">
    <h1>📖 Selector Bíblico</h1>
    <p class="site-subtitle">Busca, copia y guarda tus versículos favoritos</p>
  </header>

  <main class="main-content">
    <form id="verseForm" class="verse-form" novalidate>
      <div class="select-grid">
        <div class="form-group">
          <label for="book">Libro</label>
          <select id="book" required>
            <option value="">Cargando libros…</option>
          </select>
        </div>

        <div class="form-group">
          <label for="chapter">Capítulo</label>
          <select id="chapter" required disabled>
            <option value="">—</option>
          </select>
        </div>

        <div class="form-group">
          <label for="verse">Versículo</label>
          <select id="verse" required disabled>
            <option value="">—</option>
          </select>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary">📖 Mostrar</button>
        <button type="button" class="btn-secondary" id="btnRandom">🎲 Aleatorio</button>
        <button type="button" class="btn-secondary" id="btnCopy" disabled>📋 Copiar</button>
        <button type="button" class="btn-secondary" id="btnFavorite" disabled>⭐ Guardar</button>
      </div>
    </form>

    <section class="verse-display" id="verseDisplay" aria-live="polite">
      <p class="verse-placeholder">Selecciona un pasaje para ver el versículo</p>
    </section>

    <section class="favorites-section">
      <h2>⭐ Favoritos guardados</h2>
      <ul class="favorites-list" id="favoritesList">
        <li class="empty-state">Aún no has guardado ningún versículo.</li>
      </ul>
    </section>
  </main>

  <div class="toast" id="toast" hidden><span id="toastMsg"></span></div>

  <footer class="site-footer">
    <small>Datos de muestra representativa · Hecho con ❤️</small>
  </footer>

  <script src="scr/js/app.js" defer></script>
</body>
</html>
